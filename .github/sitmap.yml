name: Generate Sitemap

on:
  push:
    branches: [ main ]
    paths:
      - '**.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generate and Commit Sitemap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to derive accurate <lastmod> dates from git history

      - name: Generate the sitemap
        id: sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://ideagent.github.io/
          drop-html-extension: false
          include-pdf: false

      - name: Commit and push if changed
        run: |
          if [[ $(git status --porcelain sitemap.xml) ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add sitemap.xml
            git commit -m "Automated sitemap update [skip ci]" sitemap.xml
            git push
          else
            echo "sitemap.xml is already up to date."
          fi
